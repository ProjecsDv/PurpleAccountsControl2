<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PurpleAccountsControl2</title>
<style>
:root{--bg:#0a0a0f;--card:#15151f;--roxo:#8b5cf6;--cinza:#8b8b9f}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.tela{display:none;width:100%;max-width:460px}.tela.ativa{display:block}
.card{background:var(--card);border:1px solid #222236;border-radius:24px;padding:28px}
.btn{width:100%;padding:15px;background:var(--roxo);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer}
.btn-sec{background:#222232}
input{width:100%;padding:13px;background:#0f0f18;border:1px solid #2a2a3d;border-radius:10px;color:#fff;margin-bottom:10px}
.banner{width:100%;height:110px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;overflow:hidden}
.foto{width:80px;height:80px;border-radius:50%;background:#222;border:4px solid var(--card);margin:-35px 0 0 20px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:30px}
.amigo{display:flex;gap:10px;align-items:center;padding:10px;background:#0f0f18;border-radius:10px;margin-bottom:8px}
.aba{flex:1;padding:10px;background:#1e1e2f;border:none;border-radius:8px;color:var(--cinza);cursor:pointer}.aba.ativa{background:var(--roxo);color:#fff}
.conteudoAba{display:none}.conteudoAba.ativa{display:block}
</style>
</head>
<body>

<div id="tela1" class="tela ativa"><div class="card"><h1 style="text-align:center">PURPLE ACCOUNTS 2</h1><p style="color:var(--cinza);text-align:center;font-size:13px;margin:8px 0 20px">nova versão. sem suporte. sem reembolso.</p>
<button class="btn" onclick="ir('tela2')">Create Account</button>
<button class="btn btn-sec" style="margin-top:10px" onclick="ir('telaLogin')">Entrar Na Conta</button>
</div></div>

<div id="tela2" class="tela"><div class="card"><h2>Criar</h2><br><input id="inputNome" placeholder="Seu nome"><input id="inputSenha" type="password" placeholder="Senha"><button class="btn" onclick="criarConta()">Criar</button><button class="btn btn-sec" style="margin-top:10px" onclick="ir('tela1')">Voltar</button></div></div>

<div id="telaLogin" class="tela"><div class="card"><h2>Entrar</h2><br><input id="loginNome" placeholder="Seu nome"><input id="loginSenha" type="password" placeholder="Senha"><button class="btn" onclick="entrarConta()">Entrar</button><button class="btn btn-sec" style="margin-top:10px" onclick="ir('tela1')">Voltar</button><p id="loginErro" style="color:#ff5a5a;font-size:12px;margin-top:10px;text-align:center;display:none">nome ou senha errados</p></div></div>

<div id="tela3" class="tela" style="max-width:500px"><div class="card">
<div style="position:relative"><div class="banner" id="divBanner" onclick="trocarBanner()">TROCAR BANNER</div><div class="foto" id="divFoto" onclick="trocarFoto()">:)</div></div>
<h2 id="nomePerfil" contenteditable="true" style="margin-top:45px;outline:none"></h2>
<div id="bioPerfil" contenteditable="true" style="color:var(--cinza);font-size:14px;margin:6px 0 14px">clique pra editar bio...</div>
<input type="color" id="inputCor" value="#8b5cf6" oninput="mudarCor(this.value)" style="height:38px;padding:4px">
<div style="display:flex;gap:8px;margin:14px 0"><button class="aba ativa" onclick="abrirAba('amigos',this)">Amigos</button><button class="aba" onclick="abrirAba('config',this)">Configs</button></div>
<div id="abaAmigos" class="conteudoAba ativa"><div style="display:flex;gap:8px"><input id="inputAmigo" placeholder="nome amigo" style="margin:0"><button class="btn" style="width:80px" onclick="addAmigo()">Add</button></div><div id="listaAmigos" style="margin-top:10px"></div></div>
<div id="abaConfig" class="conteudoAba"><input id="novaSenha" placeholder="nova senha"><button class="btn" style="background:#222232" onclick="salvarPerfil()">Salvar</button><button class="btn" style="background:#3a1a1a;margin-top:10px" onclick="sairConta()">Apagar Conta</button></div>
</div></div>

<input type="file" id="fileFoto" accept="image/*" hidden><input type="file" id="fileBanner" accept="image/*" hidden>

<script>
function ir(id){document.querySelectorAll('.tela').forEach(x=>x.classList.remove('ativa'));document.getElementById(id).classList.add('ativa'); document.getElementById('loginErro').style.display='none'}
let dados = JSON.parse(localStorage.getItem('pac2')||'null');
if(dados) carregar();

function criarConta(){
  let n=document.getElementById('inputNome').value.trim();
  let s=document.getElementById('inputSenha').value.trim();
  if(!n||!s) return alert('preenche nome e senha');
  dados={nome:n,senha:s,bio:'clique pra editar bio...',foto:'',banner:'',amigos:[],cor:'#8b5cf6'};
  salvar(); carregar();
}
function entrarConta(){
  let n=document.getElementById('loginNome').value.trim();
  let s=document.getElementById('loginSenha').value.trim();
  let salvo = JSON.parse(localStorage.getItem('pac2')||'null');
  if(!salvo){ alert('nenhuma conta criada ainda'); return ir('tela2'); }
  if(salvo.nome===n && salvo.senha===s){ dados=salvo; carregar(); }
  else{ document.getElementById('loginErro').style.display='block'; }
}
function carregar(){
  ir('tela3');
  document.getElementById('nomePerfil').innerText=dados.nome;
  document.getElementById('bioPerfil').innerText=dados.bio;
  if(dados.foto) document.getElementById('divFoto').innerHTML=`<img src="${dados.foto}" style="width:100%;height:100%;object-fit:cover">`;
  if(dados.banner) document.getElementById('divBanner').innerHTML=`<img src="${dados.banner}" style="width:100%;height:100%;object-fit:cover">`;
  document.getElementById('inputCor').value=dados.cor;
  document.documentElement.style.setProperty('--roxo',dados.cor);
  renderAmigos();
}
function trocarFoto(){document.getElementById('fileFoto').click()}
function trocarBanner(){document.getElementById('fileBanner').click()}
document.getElementById('fileFoto').onchange=e=>{
  let r=new FileReader(); r.onload=()=>{dados.foto=r.result; salvar(); carregar()}; r.readAsDataURL(e.target.files[0]);
}
document.getElementById('fileBanner').onchange=e=>{
  let r=new FileReader(); r.onload=()=>{dados.banner=r.result; salvar(); carregar()}; r.readAsDataURL(e.target.files[0]);
}
function mudarCor(c){dados.cor=c; document.documentElement.style.setProperty('--roxo',c); salvar()}
function addAmigo(){
  let v=document.getElementById('inputAmigo').value.trim(); if(!v) return;
  dados.amigos.push(v); document.getElementById('inputAmigo').value=''; salvar(); renderAmigos();
}
function renderAmigos(){
  let la=document.getElementById('listaAmigos');
  la.innerHTML=dados.amigos.length?dados.amigos.map((x,i)=>`<div class=amigo><b>${x[0].toUpperCase()}</b> ${x}<span onclick="dados.amigos.splice(${i},1);salvar();renderAmigos()" style="margin-left:auto;cursor:pointer">x</span></div>`).join(''):'<p style="color:var(--cinza);font-size:12px;text-align:center">sem amigos ainda</p>';
}
function abrirAba(t,el){
  document.querySelectorAll('.aba').forEach(x=>x.classList.remove('ativa'));
  document.querySelectorAll('.conteudoAba').forEach(x=>x.classList.remove('ativa'));
  el.classList.add('ativa'); document.getElementById('aba'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('ativa');
}
function salvarPerfil(){
  dados.bio=document.getElementById('bioPerfil').innerText;
  dados.nome=document.getElementById('nomePerfil').innerText;
  let ns=document.getElementById('novaSenha').value.trim(); if(ns) dados.senha=ns;
  salvar(); alert('salvo!');
}
function salvar(){localStorage.setItem('pac2',JSON.stringify(dados))}
function sairConta(){if(confirm('apagar conta?')){localStorage.removeItem('pac2'); location.reload()}}
</script>
</body>
</html>
