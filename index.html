<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PurpleAccounts V4.1 - Purple File</title>
<style>
:root{--bg:#0a0a0f;--card:#15151f;--roxo:#8b5cf6;--cinza:#8b8b9f}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.tela{display:none;width:100%;max-width:460px}.tela.ativa{display:block}
.card{background:var(--card);border:1px solid #222236;border-radius:24px;padding:28px}
.btn{width:100%;padding:15px;background:var(--roxo);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer}
.btn-sec{background:#222232}
.btn-purple{background:#1e1e2f;border:1px dashed var(--roxo)}
input{width:100%;padding:13px;background:#0f0f18;border:1px solid #2a2a3d;border-radius:10px;color:#fff;margin-bottom:10px}
.banner{width:100%;height:110px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;overflow:hidden}
.foto{width:80px;height:80px;border-radius:50%;background:#222;border:4px solid var(--card);margin:-35px 0 0 20px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:30px}
.amigo{display:flex;gap:10px;align-items:center;padding:10px;background:#0f0f18;border-radius:10px;margin-bottom:8px}
.aba{flex:1;padding:8px;background:#1e1e2f;border:none;border-radius:8px;color:var(--cinza);cursor:pointer;font-size:12px}.aba.ativa{background:var(--roxo);color:#fff}
.conteudoAba{display:none}.conteudoAba.ativa{display:block}
.appCard{display:flex;gap:12px;align-items:center;padding:12px;background:#0f0f18;border:1px solid #222236;border-radius:12px;margin-bottom:10px}
.appCapa{width:50px;height:50px;border-radius:10px;background:linear-gradient(135deg,var(--roxo),#ec4899);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1f1f2e;border:1px solid var(--roxo);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;transition:.4s;z-index:999;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="toast"></div>

<div id="tela1" class="tela ativa"><div class="card"><h1 style="text-align:center">PURPLE 4.1</h1><p style="color:var(--cinza);text-align:center;font-size:13px;margin:8px 0 20px">eternal edition. arquivo.purple</p>
<button class="btn" onclick="ir('tela2')">Create Account</button>
<button class="btn btn-sec" style="margin-top:10px" onclick="ir('telaLogin')">Entrar Na Conta</button>
<button class="btn btn-purple" style="margin-top:10px" onclick="document.getElementById('filePurple').click()">📥 COLOCAR BACKUP (.purple)</button>
<p style="color:var(--cinza);font-size:10px;text-align:center;margin-top:8px">coloca o arquivo e recupera tudo na hora</p>
</div></div>

<div id="tela2" class="tela"><div class="card"><h2>Criar</h2><br><input id="inputNome" placeholder="Seu nome"><input id="inputSenha" type="password" placeholder="Senha"><button class="btn" onclick="criarConta()">Criar</button><button class="btn btn-sec" style="margin-top:10px" onclick="ir('tela1')">Voltar</button></div></div>

<div id="telaLogin" class="tela"><div class="card"><h2>Entrar</h2><br><input id="loginNome" placeholder="Seu nome"><input id="loginSenha" type="password" placeholder="Senha"><button class="btn" onclick="entrarConta()">Entrar</button><button class="btn btn-sec" style="margin-top:10px" onclick="ir('tela1')">Voltar</button><p id="loginErro" style="color:#ff5a5a;font-size:12px;margin-top:10px;text-align:center;display:none">nome ou senha errados</p></div></div>

<div id="tela3" class="tela" style="max-width:500px"><div class="card">
<div style="position:relative"><div class="banner" id="divBanner" onclick="trocarBanner()">TROCAR BANNER</div><div class="foto" id="divFoto" onclick="trocarFoto()">:)</div></div>
<h2 id="nomePerfil" contenteditable="true" style="margin-top:45px;outline:none"></h2>
<div id="bioPerfil" contenteditable="true" style="color:var(--cinza);font-size:14px;margin:6px 0 14px">clique pra editar bio...</div>
<input type="color" id="inputCor" value="#8b5cf6" oninput="mudarCor(this.value)" style="height:38px;padding:4px">

<div style="display:flex;gap:6px;margin:14px 0">
<button class="aba ativa" onclick="abrirAba('amigos',this)">Amigos</button>
<button class="aba" onclick="abrirAba('biblioteca',this)">Biblioteca</button>
<button class="aba" onclick="abrirAba('config',this)">Configs</button>
</div>

<div id="abaAmigos" class="conteudoAba ativa">
<div style="display:flex;gap:8px"><input id="inputAmigo" placeholder="nome amigo" style="margin:0"><button class="btn" style="width:80px;margin:0" onclick="addAmigo()">Add</button></div>
<div id="listaAmigos" style="margin-top:10px"></div>
</div>

<div id="abaBiblioteca" class="conteudoAba">
<button class="btn" onclick="document.getElementById('fileApk').click()">📦 Importar Para Biblioteca</button>
<p style="color:var(--cinza);font-size:11px;text-align:center;margin:8px 0">apenas arquivos.apk</p>
<div id="listaBiblioteca" style="margin-top:12px"></div>
</div>

<div id="abaConfig" class="conteudoAba">
<input id="novaSenha" placeholder="nova senha">
<button class="btn btn-sec" onclick="salvarPerfil()">Salvar Perfil</button>
<hr style="margin:18px 0;border-color:#222236">
<button class="btn" onclick="exportarBackup()">💾 GERAR ARQUIVO.PURPLE</button>
<p style="color:var(--cinza);font-size:10px;text-align:center;margin:6px 0 10px">isso baixa teu arquivo.purple pra instalar depois</p>
<button class="btn btn-purple" onclick="document.getElementById('filePurple').click()">📥 COLOCAR BACKUP (.purple)</button>
<button class="btn" id="autoBtn" onclick="toggleAutoBackup()" style="background:#222232;margin-top:10px">🤖 Auto-Backup: OFF</button>
<button class="btn" style="background:#3a1a1a;margin-top:18px" onclick="sairConta()">Apagar Conta</button>
</div>
</div></div>

<input type="file" id="fileFoto" accept="image/*" hidden>
<input type="file" id="fileBanner" accept="image/*" hidden>
<input type="file" id="fileApk" accept=".apk" hidden>
<input type="file" id="filePurple" accept=".purple,.json" hidden>

<script>
let dados = JSON.parse(localStorage.getItem('purpleV3')||'{"perfis":{}}');
let perfilAtual = null; let intervaloAuto=null; let autoAtivo=false;
function toast(t){let el=document.getElementById('toast');el.innerText=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}
function ir(id){document.querySelectorAll('.tela').forEach(e=>e.classList.remove('ativa'));document.getElementById(id).classList.add('ativa')}
function salvar(){localStorage.setItem('purpleV3', JSON.stringify(dados))}
function criarConta(){let n=document.getElementById('inputNome').value.trim(), s=document.getElementById('inputSenha').value; if(!n||!s) return toast('preenche tudo'); if(dados.perfis[n]) return toast('nome já existe'); dados.perfis[n]={nome:n,senha:s,bio:'clique pra editar bio...',cor:'#8b5cf6',amigos:[],biblioteca:[],foto:'',banner:''}; salvar(); perfilAtual=n; carregarPerfil(); ir('tela3'); toast('conta criada!')}
function entrarConta(){let n=document.getElementById('loginNome').value.trim(), s=document.getElementById('loginSenha').value; if(dados.perfis[n] && dados.perfis[n].senha===s){perfilAtual=n;carregarPerfil();ir('tela3');toast('bem vindo '+n)} else {document.getElementById('loginErro').style.display='block'}}
function carregarPerfil(){let p=dados.perfis[perfilAtual]; document.getElementById('nomePerfil').innerText=p.nome; document.getElementById('bioPerfil').innerText=p.bio; document.getElementBy
